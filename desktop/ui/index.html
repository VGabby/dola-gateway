<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dola Gateway</title>
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="mark" aria-hidden="true">✦</div>
    <p class="eyebrow">Dola Gateway</p>
    <h1 id="title">Starting your private workspace</h1>
    <p id="detail">Preparing the bundled Python service and automation browser…</p>
    <div class="progress" id="progress" aria-label="Starting"><span></span></div>
    <div class="actions" id="actions" hidden>
      <a class="primary" href="dola://retry">Retry startup</a>
      <a href="dola://support">Create recovery report</a>
    </div>
    <p class="privacy">Everything runs on this computer. Dola Gateway sends no telemetry and never performs a generation as a startup test.</p>
  </main>
  <script src="desktop.js"></script>
</body>
</html>
