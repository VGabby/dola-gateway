[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dola-image-gateway"
dynamic = ["version"]
description = "Local multi-account Dola image and video generation gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp",
  "fastapi",
  "opencv-python-headless",
  "patchright",
  "pillow",
  "pydantic",
  "python-dotenv",
  "uvicorn[standard]",
]

[dependency-groups]
dev = [
  "httpx2",
  "pytest",
  "pytest-socket",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dola_gateway = [
  "VERSION",
  "web/*.html",
  "extensions/dola30/*.js",
  "extensions/dola30/*.json",
  "extensions/dola30/*.md",
]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost"
filterwarnings = [
  "error",
  # Starlette 1.6 still references AnyIO's deprecated compatibility alias.
  "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette\\.testclient",
]
