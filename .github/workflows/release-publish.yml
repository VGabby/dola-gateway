name: Publish desktop release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download complete verified bundle
        uses: actions/download-artifact@v8
        with:
          name: verified-release
          path: dist/release

      - name: Validate stable tag and complete bundle
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ "${RELEASE_TAG}" != "v${version}" || "${version}" == *-* ]]; then
            echo "Only stable vVERSION tags may be published" >&2
            exit 1
          fi
          python tools/release/check_release.py --tag "${RELEASE_TAG}"
          python tools/release/create_manifest.py \
            --verify-only dist/release \
            --expected-version "${version}"
          python tools/release/changelog.py "${version}" --output dist/release/RELEASE_NOTES.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          files=(
            dist/release/*.dmg
            dist/release/*.exe
            dist/release/*.sha256
            dist/release/*.metadata.json
            dist/release/SHA256SUMS
            dist/release/release-manifest.json
          )
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber
            gh release edit "${RELEASE_TAG}" --notes-file dist/release/RELEASE_NOTES.md
          else
            gh release create "${RELEASE_TAG}" "${files[@]}" \
              --title "Dola Gateway ${RELEASE_TAG}" \
              --notes-file dist/release/RELEASE_NOTES.md \
              --verify-tag
          fi
